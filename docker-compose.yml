services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlops
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    command:
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://mlops:mlops@db:5432/mlops
      - --default-artifact-root=/mlruns
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/mlruns
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://mlops:mlops@db:5432/mlops
      MLFLOW_TRACKING_URI: http://mlflow:5000
      UPLOAD_DIR: /app/data/uploads
      API_KEY: ${API_KEY:?Set API_KEY in .env}
    ports:
      - "8002:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./mlruns:/mlruns
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:?Set API_KEY in .env}
    ports:
      - "8503:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
